name: Fetch Ryanair Prices
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: node fetch-prices.js
      - name: Commit prices
        run: |
          git config --global user.email "bot@irishtriplab.com"
          git config --global user.name "PriceBot"
          git add prices.json
          git diff --staged --quiet || git commit -m "Update prices"
          git push
